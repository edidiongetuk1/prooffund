<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wall | Boundless Build Day</title>
<style>
  :root {
    --bg: #0a0f0d;
    --card: #131a17;
    --line: #25302b;
    --text: #f1f5f3;
    --muted: #93a19b;
    --accent: #2eedaa;
    --error: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* Phone view */
  .phone { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  .phone h1 { margin: 6px 0 8px; font-size: 40px; line-height: 1.1; }
  .phone .lead { margin: 0 0 24px; color: var(--muted); }
  label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; font-size: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 10px;
    background: var(--accent); color: #05231a; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: wait; }
  .status { margin: 14px 0 0; min-height: 24px; color: var(--muted); }
  .status.error { color: var(--error); }
  .done { display: none; margin-top: 24px; padding: 20px; border: 1px solid var(--accent); border-radius: 14px; background: var(--card); }
  .done.show { display: block; animation: pop .4s ease-out; }
  .done .big { font-size: 34px; font-weight: 800; line-height: 1.15; }
  .done p { margin: 10px 0 0; color: var(--muted); font-size: 15px; word-break: break-word; }
  .feed-title { margin: 36px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); }

  /* Notes, used by both views */
  .notes { display: grid; gap: 10px; }
  .note { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow-wrap: anywhere; }
  .note.new { animation: pop .5s ease-out; border-color: var(--accent); }
  .note .head { display: flex; gap: 8px; align-items: baseline; }
  .note .num { color: var(--accent); font-weight: 700; }
  .note .name { font-weight: 700; }
  .note .msg { margin-top: 2px; color: #c9d3cf; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Projector view, open with ?screen */
  .screen { display: none; min-height: 100vh; padding: 3vh 3vw; grid-template-columns: minmax(280px, 26vw) 1fr; gap: 3vw; }
  body.is-screen .phone { display: none; }
  body.is-screen .screen { display: grid; }
  .side { display: flex; flex-direction: column; gap: 2.4vh; }
  .side h1 { margin: 0; font-size: clamp(36px, 4.2vw, 84px); line-height: 1.02; }
  .qr { padding: 1.2vw; border-radius: 16px; background: #fff; line-height: 0; }
  .qr svg { width: 100%; height: auto; display: block; }
  .link { color: var(--muted); font-size: clamp(14px, 1.15vw, 22px); word-break: break-all; }
  .count { margin-top: auto; }
  .count .n { color: var(--accent); font-size: clamp(64px, 9vw, 180px); font-weight: 800; line-height: 1; }
  .count .label { color: var(--muted); font-size: clamp(16px, 1.4vw, 26px); }
  .screen .notes { align-content: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22vw), 1fr)); max-height: 94vh; overflow: hidden; }
  .screen .note { padding: 1.1vw 1.3vw; }
  .screen .note .head, .screen .note .msg { font-size: clamp(16px, 1.35vw, 28px); }
  .empty { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .note.new, .done.show { animation: none; }
  }
</style>
</head>
<body>

<main class="phone">
  <div class="eyebrow">Boundless Build Day, Uyo</div>
  <h1>Sign the wall</h1>
  <p class="lead">Put your name on a public blockchain. No app and no wallet needed. It takes about 30 seconds.</p>

  <form id="form">
    <label for="name">Your name</label>
    <input id="name" maxlength="30" required autocomplete="off" placeholder="Ada">
    <label for="message">Say something to the room</label>
    <input id="message" maxlength="100" autocomplete="off" placeholder="Uyo to the world">
    <button id="go" type="submit">Sign the wall</button>
  </form>
  <p id="status" class="status" role="status"></p>

  <section id="done" class="done">
    <div class="big" id="doneTitle"></div>
    <p id="doneFee"></p>
    <p><a id="doneLink" target="_blank" rel="noopener">See your transaction</a></p>
  </section>

  <div class="feed-title"><span id="phoneCount">0</span> signatures so far</div>
  <div id="phoneNotes" class="notes"></div>
</main>

<section class="screen">
  <div class="side">
    <div class="eyebrow">Boundless Build Day, Uyo</div>
    <h1>Sign the wall</h1>
    <div class="qr" id="qr"></div>
    <div class="link" id="link"></div>
    <div class="count">
      <div class="n" id="screenCount">0</div>
      <div class="label">signatures on testnet</div>
    </div>
  </div>
  <div id="screenNotes" class="notes"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk@17.4.0/dist/stellar-sdk.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  // The wall contract on testnet. Anyone can read it and anyone can sign it.
  const WALL_ID = "CB5EZ2C3JXSXW7PNCQ6EE7GLKUKL332REK62ARDBH3UUNNY2LQAD2R5I";
  const RPC_URL = "https://soroban-testnet.stellar.org";
  const EXPLORER = "https://stellar.expert/explorer/testnet";

  const { Contract, Keypair, Networks, TransactionBuilder, BASE_FEE, nativeToScVal, scValToNative, rpc } = StellarSdk;
  const server = new rpc.Server(RPC_URL);
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const isScreen = params.has("screen");
  // Hide a note from the projector: add ?screen&hide=3,7 to the address.
  const hidden = new Set((params.get("hide") || "").split(",").filter(Boolean).map(Number));

  // Your throwaway testnet key lives only in this browser.
  function myKeypair() {
    try {
      const saved = localStorage.getItem("wall-key");
      if (saved) return Keypair.fromSecret(saved);
      const fresh = Keypair.random();
      localStorage.setItem("wall-key", fresh.secret());
      return fresh;
    } catch {
      return Keypair.random();
    }
  }

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function ensureAccount(publicKey) {
    try {
      return await server.getAccount(publicKey);
    } catch {
      // New here, so ask Friendbot for free test XLM, then wait for the account to appear.
    }
    for (let attempt = 0; attempt < 4; attempt++) {
      await fetch(`https://friendbot.stellar.org/?addr=${publicKey}`).catch(() => {});
      for (let check = 0; check < 6; check++) {
        try {
          return await server.getAccount(publicKey);
        } catch {
          await wait(1000);
        }
      }
    }
    throw new Error("Could not create your account. Please try again.");
  }

  async function sign(name, message) {
    const me = myKeypair();
    say("Creating your account. This takes about 20 seconds...");
    const account = await ensureAccount(me.publicKey());

    say("Signing...");
    const call = new Contract(WALL_ID).call(
      "sign",
      nativeToScVal(me.publicKey(), { type: "address" }),
      nativeToScVal(name, { type: "string" }),
      nativeToScVal(message, { type: "string" }),
    );
    const tx = new TransactionBuilder(account, { fee: BASE_FEE, networkPassphrase: Networks.TESTNET })
      .addOperation(call)
      .setTimeout(60)
      .build();
    const prepared = await server.prepareTransaction(tx);
    prepared.sign(me);

    const sent = await server.sendTransaction(prepared);
    if (sent.status === "ERROR") throw new Error("The network rejected it. Please try again.");

    say("Waiting for the network...");
    const result = await server.pollTransaction(sent.hash, { attempts: 20 });
    if (result.status !== "SUCCESS") throw new Error("That didn't go through. Please try again.");
    return { hash: sent.hash, number: scValToNative(result.returnValue), fee: Number(prepared.fee) / 1e7 };
  }

  function say(text, isError) {
    $("status").textContent = text;
    $("status").className = isError ? "status error" : "status";
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const name = $("name").value.trim();
    const message = $("message").value.trim();
    if (!name) return;
    $("go").disabled = true;
    try {
      const { hash, number, fee } = await sign(name, message);
      say("");
      $("doneTitle").textContent = `You're #${number} on the wall`;
      $("doneFee").textContent = `Your note is on testnet now. Network fee: ${fee.toFixed(5)} test XLM or less.`;
      $("doneLink").href = `${EXPLORER}/tx/${hash}`;
      $("done").classList.add("show");
    } catch (error) {
      say(error.message || "Something went wrong. Please try again.", true);
    }
    $("go").disabled = false;
  });

  // The feed: the page asks the network for Signed events and draws them.
  const notes = new Map();
  let cursor = null;
  let firstLoad = true;

  async function refresh() {
    const filters = [{ type: "contract", contractIds: [WALL_ID] }];
    const request = cursor ? { cursor, filters, limit: 200 } : { startLedger: await startLedger(), filters, limit: 200 };
    const page = await server.getEvents(request);
    const fresh = [];
    for (const event of page.events) {
      const note = scValToNative(event.value);
      if (notes.has(note.number)) continue;
      const entry = { ...note, hash: event.txHash };
      notes.set(note.number, entry);
      fresh.push(note.number);
    }
    if (page.cursor) cursor = page.cursor;
    draw(new Set(firstLoad ? [] : fresh));
    firstLoad = false;
  }

  // The network searches about 10,000 ledgers per request, which is around 14 hours.
  async function startLedger() {
    const health = await server.getHealth();
    return Math.max(health.oldestLedger + 1, health.latestLedger - 9000);
  }

  function noteEl(note, isNew) {
    const el = document.createElement(isScreen ? "div" : "a");
    el.className = isNew ? "note new" : "note";
    if (!isScreen) {
      el.href = `${EXPLORER}/tx/${note.hash}`;
      el.target = "_blank";
      el.rel = "noopener";
      el.style.color = "inherit";
      el.style.textDecoration = "none";
    }
    const head = document.createElement("div");
    head.className = "head";
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = `#${note.number}`;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = note.name;
    head.append(num, name);
    el.append(head);
    if (note.message) {
      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = note.message;
      el.append(msg);
    }
    return el;
  }

  function draw(fresh) {
    const sorted = [...notes.values()].sort((a, b) => b.number - a.number);
    const top = sorted.length ? sorted[0].number : 0;
    $("phoneCount").textContent = top;
    $("screenCount").textContent = top;
    const box = $(isScreen ? "screenNotes" : "phoneNotes");
    const visible = sorted.filter((note) => !isScreen || !hidden.has(note.number)).slice(0, isScreen ? 40 : 15);
    box.replaceChildren(...visible.map((note) => noteEl(note, fresh.has(note.number))));
    if (!visible.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nobody yet. Be the first.";
      box.append(empty);
    }
  }

  function setUpScreen() {
    document.body.classList.add("is-screen");
    const url = location.origin + location.pathname;
    $("link").textContent = url.replace(/^https?:\/\//, "");
    if (window.qrcode) {
      const code = qrcode(0, "M");
      code.addData(url);
      code.make();
      $("qr").innerHTML = code.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    }
  }

  // Ask again a few seconds after each answer, so slow wifi can't pile up requests.
  async function keepRefreshing() {
    await refresh().catch(() => {});
    setTimeout(keepRefreshing, 3000);
  }

  if (isScreen) setUpScreen();
  keepRefreshing();
</script>
</body>
</html>
